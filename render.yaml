services:
  - type: web
    name: chrissoft-ai-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @equation-orchestra/backend... build
    startCommand: pnpm --filter @equation-orchestra/backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
